version: '3.8'

services:
  pricing-api:
    build: .
    container_name: pricing-api
    restart: unless-stopped
    ports:
      - "8000:8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-pricing
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - pricing-api

volumes:
  n8n_data:
